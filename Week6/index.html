
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Cards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>My Profile Cards</h1>

    <div class="profile-container">

        <!-- Blue Profile Card -->
        <div class="profile-card blue-card">
            <img src="https://placehold.co/150x150/2563eb/ffffff?text=JD"
                 alt="John Doe profile picture"
                 class="avatar">

            <h2>John Doe</h2>
            <p>Web Development Student</p>
        </div>

        <!-- Green Profile Card -->
        <div class="profile-card green-card">
            <img src="https://placehold.co/150x150/15803d/ffffff?text=JD"
                 alt="John Doe profile picture"
                 class="avatar">

            <h2>John Doe</h2>
            <p>Technology Enthusiast</p>
        </div>

    </div>

</body>
</html>
