
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Landing Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <h2 class="logo">TechZone</h2>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h1>Welcome to TechZone</h1>
                <p>Explore technology and discover new possibilities.</p>
                <button>Get Started</button>
            </div>

            <img src="https://placehold.co/600x350" alt="Technology workspace">
        </section>

        <section class="services">
            <h2>Our Services</h2>

            <div class="service-grid">
                <div class="service-card">Web Development</div>
                <div class="service-card">UI Design</div>
                <div class="service-card">Digital Solutions</div>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 TechZone. All rights reserved.</p>
    </footer>

</body>
</html>
