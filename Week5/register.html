
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Register for Tech Club events">
    <meta name="author" content="Vaibhav Gangwar">
    <title>Tech Club - Register</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Vaibhav Gangwar</h1>
        <h2>Tech Club</h2>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="register.html">Register</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h2>Student Registration</h2>

        <form>
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>
            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <br><br>

            <label for="date">Date of Birth:</label>
            <input type="date" id="date" name="date">
            <br><br>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone">
            <br><br>

            <p>Gender:</p>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
            <br><br>

            <p>Choose your interests:</p>
            <input type="checkbox" id="coding" name="interests" value="coding">
            <label for="coding">Coding</label>
            <input type="checkbox" id="web" name="interests" value="web">
            <label for="web">Web Development</label>
            <input type="checkbox" id="gaming" name="interests" value="gaming">
            <label for="gaming">Gaming</label>
            <br><br>

            <label for="event">Select an Event:</label>
            <select id="event" name="event">
                <option value="hackathon">Hackathon</option>
                <option value="web-workshop">Web Development Workshop</option>
                <option value="gaming">Gaming Event</option>
            </select>
            <br><br>

            <label for="message">Why do you want to join?</label>
            <br>
            <textarea id="message" name="message" rows="4" cols="30"></textarea>
            <br><br>

            <button type="submit">Register</button>
        </form>
    </main>

    <footer>
        <p>Tech Club - 2026</p>
    </footer>

</body>
</html>
