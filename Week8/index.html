<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h2>My Dashboard</h2>
    </header>

    <aside class="sidebar">
        <h3>Menu</h3>
        <p>Home</p>
        <p>Analytics</p>
        <p>Settings</p>
    </aside>

    <main class="main-content">
        <h2>Dashboard Overview</h2>

        <div class="dashboard-grid">
    <div class="dashboard-box">
        <span class="box-icon">👥</span>
        <span class="box-text">Users</span>
    </div>

    <div class="dashboard-box">
        <span class="box-icon">💰</span>
        <span class="box-text">Sales</span>
    </div>

    <div class="dashboard-box">
        <span class="box-icon">📈</span>
        <span class="box-text">Revenue</span>
    </div>

    <div class="dashboard-box">
        <span class="box-icon">📦</span>
        <span class="box-text">Orders</span>
    </div>

    <div class="dashboard-box">
        <span class="box-icon">👤</span>
        <span class="box-text">Visitors</span>
    </div>

    <div class="dashboard-box">
        <span class="box-icon">📊</span>
        <span class="box-text">Reports</span>
    </div>
</div>
    </main>

    <footer class="footer">
        <p>© 2026 My Dashboard</p>
    </footer>

</body>
</html>
